<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMSCS Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'bg-color': '#f9f9f9',
              'white': '#fefefe',
              'black': '#1b1b1b',
              'accent': '#86b58f'
            }
          }
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/preline@latest/dist/preline.js"></script>
</head>
<body class="bg-bg-color text-black min-h-screen">
    <header class="bg-accent text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="mt-4 text-5xl font-semibold tracking-tight">OMSCS Planner</h1>
            <p class="mt-3 max-w-2xl mx-auto text-sm leading-6 text-white/80">lorem ipsum</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        <div class="overflow-hidden rounded-[28px] border border-black/10 bg-white shadow-[0_32px_100px_rgba(0,0,0,0.08)]">
            <div class="bg-bg-color px-6 py-6">
                <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                    <div>
                        <p class="text-xs uppercase tracking-[0.25em] text-black/60">Full listing</p>
                        <h2 class="mt-2 text-3xl font-semibold text-black">Courses Offered</h2>
                    </div>
                    <div class="inline-flex items-center gap-2 rounded-full border border-black/10 bg-white px-4 py-2 text-sm font-medium text-black">
                        <span class="inline-flex h-2.5 w-2.5 rounded-full bg-accent"></span>
                        <span>Total courses:</span>
                        <span id="course-count">0</span>
                    </div>
                </div>

                <div class="mt-6 grid gap-3 md:grid-cols-2 lg:grid-cols-5">
                    <label class="block">
                        <span class="text-xs font-semibold uppercase tracking-[0.18em] text-black/60">Search</span>
                        <input id="course-search" type="search" placeholder="Course or title" class="mt-2 w-full rounded-3xl border border-black/10 bg-white px-4 py-3 text-sm text-black outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/20" />
                    </label>
                    <label class="block">
                        <span class="text-xs font-semibold uppercase tracking-[0.18em] text-black/60">Specialization</span>
                        <select id="specialization-filter" class="mt-2 w-full rounded-3xl border border-black/10 bg-white px-4 py-3 text-sm text-black outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/20">
                            <option value="">All specializations</option>
                        </select>
                    </label>
                    <label class="block">
                        <span class="text-xs font-semibold uppercase tracking-[0.18em] text-black/60">Language</span>
                        <select id="language-filter" class="mt-2 w-full rounded-3xl border border-black/10 bg-white px-4 py-3 text-sm text-black outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/20">
                            <option value="">All languages</option>
                        </select>
                    </label>
                    <label class="block">
                        <span class="text-xs font-semibold uppercase tracking-[0.18em] text-black/60">Foundational</span>
                        <select id="foundational-filter" class="mt-2 w-full rounded-3xl border border-black/10 bg-white px-4 py-3 text-sm text-black outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/20">
                            <option value="">All</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </label>
                    <label class="block">
                        <span class="text-xs font-semibold uppercase tracking-[0.18em] text-black/60">Sort</span>
                        <div class="mt-2 flex gap-2">
                            <select id="sort-field" class="flex-1 rounded-3xl border border-black/10 bg-white px-4 py-3 text-sm text-black outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/20">
                                <option value="courseId">Course</option>
                                <option value="name">Title</option>
                                <option value="language">Language</option>
                                <option value="specializations">Specializations</option>
                            </select>
                            <button id="sort-direction" type="button" class="inline-flex items-center justify-center rounded-3xl border border-black/10 bg-white px-4 py-3 text-sm text-black transition hover:bg-black/5">↑</button>
                        </div>
                    </label>
                </div>
            </div>

            <div class="px-6 py-6 border-t border-black/10 bg-white">
                <div class="mb-6">
                    <p class="text-xs uppercase tracking-[0.25em] text-black/60">Specialization details</p>
                    <h3 class="mt-2 text-2xl font-semibold text-black">Specializations and required courses</h3>
                </div>
                <div id="specialization-summary" class="grid gap-4 lg:grid-cols-2"></div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full border-separate border-spacing-0">
                    <thead class="bg-white">
                        <tr class="text-left text-xs uppercase tracking-[0.18em] text-black/70">
                            <th class="px-6 py-4">Course</th>
                            <th class="px-6 py-4">Title</th>
                            <th class="px-6 py-4">Specializations</th>
                            <th class="px-6 py-4">Language</th>
                            <th class="px-6 py-4">Foundational</th>
                        </tr>
                    </thead>
                    <tbody id="courses-table-body" class="bg-white">
                    </tbody>
                </table>
            </div>

            <div id="courses-error" class="hidden px-6 py-4 text-sm font-medium text-accent"></div>
        </div>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
